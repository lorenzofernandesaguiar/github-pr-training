<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
    <main>
        <h1>To-Do List</h1>
        <form class="task-form">
            <label for="task">Nova tarefa</label>
            <input type="text" id="task" name="task" placeholder="Digite uma tarefa">
            <button type="submit">Adicionar</button>
        </form>
        <section>
            <h2>Tarefas</h2>
            <ul>
                <li class="task-item">
                    <input type="checkbox" id="task-1">
                    <label for="task-1">Estudar Git e GitHub</label>
                </li>

                <li class="task-item">
                    <input type="checkbox" id="task-2">
                    <label for="task-2">Praticar Pull Requests</label>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
